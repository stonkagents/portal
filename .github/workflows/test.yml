name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portal:
    name: Portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci
        working-directory: .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npx vitest run

      - name: Build with the example environment
        run: |
          cp .env.example .env.production
          npm run build

  prelaunch:
    name: Prelaunch
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/prelaunch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci
        working-directory: .

      - name: Build
        run: npm run build
